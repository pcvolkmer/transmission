[package]
name = "transmission"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["proxy", "agent"]
default-members = ["proxy", "agent"]

[[bin]]
name = "transmission-proxy"
path = "proxy/src/main.rs"

[[bin]]
name = "transmission-agent"
path = "agent/src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"]}
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "full"] }
tokio-stream = "0.1"
log = "0.4"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-stream = "0.3.6"
base64 = "0.23"
reqwest = { version = "0.13.5", features = ["json"] }
reqwest-sse = "0.2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4.3"
uuid = { version = "1.28.0", features = ["v4"] }
rand = "0.10"
chacha20poly1305 = { version = "0.11.0", features = ["rand_core"] }
aead = "0.6.1"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
hkdf = "0.13"
clap = { version = "4.6.7", features = ["derive"] }
toml = "1"