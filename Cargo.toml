[package]
name = "transmission"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json"]}
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "full"] }
log = "0.4"
futures-util = "0.3"
uuid = { version = "1.28", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
async-stream = "0.3.6"
oneshot = "0.2.1"
