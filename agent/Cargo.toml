[package]
name = "transmission-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
transmission = { path = ".." }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
tokio-stream = "0.1"
log = "0.4"
reqwest = { version = "0.13", features = ["json"] }
reqwest-sse = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "color", "env"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
