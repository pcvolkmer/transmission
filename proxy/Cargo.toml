[package]
name = "transmission-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
transmission = { path = ".." }
clap = { version = "4.6", features = ["derive", "color", "env"] }
axum = { version = "0.8", features = ["json"]}
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal"] }
log = "0.4"
futures-util = "0.3"
uuid = { version = "1.28", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-stream = "0.3.6"
base64 = "0.23"
toml = "1"